name: tests

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 已到 26.04，没有 3.9 的预编译包，老版本钉在 22.04
        os: [ubuntu-22.04, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 命令行冒烟
        shell: bash
        run: |
          python -c "import imagesorter, imagesorter.exif, imagesorter.gui, main; print('import ok')"
