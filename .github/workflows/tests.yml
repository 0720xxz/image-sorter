name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v

      - name: 命令行冒烟
        shell: bash
        run: |
          python -c "import imagesorter, imagesorter.exif, imagesorter.gui, main; print('import ok')"
